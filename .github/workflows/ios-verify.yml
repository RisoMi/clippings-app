name: iOS Compile Check

# 手动触发。用途只有一件事：验证 iOS 侧能不能编译通过。
# 说明：没有 Apple 开发者账号 + 证书时，这里只能产出「模拟器用的未签名 .app」，
# 打不出能装到 iPhone 上的 .ipa。要出 ipa 需要在仓库 Secrets 里补证书。
on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可留空）'
        required: false
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-build:
    name: 编译 iOS（模拟器，不签名）
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 编译模拟器版本（不签名）
        run: flutter build ios --simulator --no-codesign

      - name: 打包 .app 用于下载
        run: |
          set -euo pipefail
          APP=$(find build/ios/iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "产物：$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" clippings-simulator.zip
          ls -lh clippings-simulator.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: clippings-simulator.zip
          if-no-files-found: error
          retention-days: 30
