name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------- 校验
  verify:
    name: 静态分析 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------- 出包
  android:
    name: 构建 Release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 解析版本名
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Release APK
        # 打 tag 时 versionName 取 tag 号（v1.1.0 → 1.1.0），保证包内版本与 Release 一致；
        # versionCode 一律用流水号，保证后续装机可以覆盖升级
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -n "$VERSION_NAME" ]; then
            flutter build apk --release --build-name="$VERSION_NAME" --build-number=${GITHUB_RUN_NUMBER}
          else
            flutter build apk --release --build-number=${GITHUB_RUN_NUMBER}
          fi

      - name: 重命名为可读文件名
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          SRC=build/app/outputs/flutter-apk/app-release.apk
          # 打 tag 时用版本号命名，同一 tag 重跑就能覆盖同一个附件
          if [ -n "$VERSION_NAME" ]; then
            NAME="clippings-app-${VERSION_NAME}.apk"
          else
            NAME="clippings-app-${GITHUB_RUN_NUMBER}.apk"
          fi
          cp "$SRC" "$NAME"
          ls -lh "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$SRC" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 这一步是本项目的关键断言：确认「分享接收」真的被打进了成品，
      # 而不只是代码里写了。Manifest 缺项时这里会直接失败。
      - name: 校验 APK 内的分享入口
        run: |
          set -uo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::warning::未找到 aapt2，跳过 Manifest 校验"
            exit 0
          fi
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          FAIL=0
          for token in \
            "android.intent.action.SEND" \
            "android.intent.action.SEND_MULTIPLE" \
            "text/plain" \
            "text/html" \
            "image/*" \
            "android.support.FILE_PROVIDER_PATHS" \
            "com.stonemii.clippings.MainActivity"
          do
            if grep -qF "$token" /tmp/manifest.txt; then
              echo "✅ $token"
            else
              echo "❌ 缺少 $token"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: clippings-app-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: 附加到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ASSET="clippings-app-${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同一 tag 重跑：先清掉历史遗留的其它 apk，保证 Release 上只挂一个包
            while IFS= read -r old; do
              if [ -z "$old" ]; then continue; fi
              if [ "$old" = "$ASSET" ]; then continue; fi
              gh release delete-asset "$TAG" "$old" --yes >/dev/null 2>&1 || true
            done < <(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.apk$' || true)
            echo "Release 已存在，覆盖上传 $ASSET"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" \
              "$ASSET#剪藏库 APK（Release）" \
              --title "剪藏库 $TAG" \
              --notes "自动构建于 ${GITHUB_SHA:0:7}。

          - 安装包：$ASSET（Release，已用 debug 密钥签名，可直接安装）
          - 要求：Android 6.0 及以上
          - 装好后在任意 APP 的分享面板里选择「剪藏库」即可保存内容
          - 版本名跟随 tag；同一 tag 重跑会覆盖此附件" \
              --generate-notes
          fi
